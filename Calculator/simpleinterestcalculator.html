 
<!DOCTYPE html> 
<html lang="en"> 
 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
    <title>Simple Interest Calculator</title> 
 
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f2f2f2; 
            text-align: center; 
            padding: 50px; 
        } 
 
        .container { 
            background: white; 
            padding: 30px; 
            width: 300px; 
            margin: auto; 
            border-radius: 10px; 
            box-shadow: 0 0 10px #ccc; 
        } 
 
        input { 
            width: 90%; 
            padding: 10px; 
            margin: 10px 0; 
        } 
 
        button { 
            padding: 10px 20px; 
            background: blue; 
            color: white; 
            border: none; 
            cursor: pointer; 
        } 
 
        #result { 
            margin-top: 20px; 
 
            font-weight: bold; 
        } 
    </style> 
</head> 
 
<body> 
 
    <div class="container"> 
 
        <h2>Simple Interest Calculator</h2> 
 
        <input type="number" id="principal" 
               placeholder="Enter Principal"> 
 
        <input type="number" id="rate" 
               placeholder="Enter Rate (%)"> 
 
        <input type="number" id="time" 
               placeholder="Enter Time (Years)"> 
 
        <button id="calculate">Calculate Interest</button> 
 
        <p id="result"></p> 
 
    </div> 
 
    <script type="module" src="main.js"></script> 
 
</body> 
</html>
