 
<!DOCTYPE html> 
<html lang="en"> 
 
<head> 
 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
    <title>Responsive Navigation Bar</title> 
 
    <style> 
 
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        } 
 
        nav { 
            background-color: #222; 
            color: white; 
            padding: 15px 40px; 
 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        } 
 
        .logo { 
            font-size: 25px; 
            font-weight: bold; 
            color: white; 
        } 
 
        .nav-links { 
            display: flex; 
            list-style: none; 
            gap: 30px; 
        } 
 
        .nav-links a { 
            text-decoration: none; 
            color: white; 
            font-size: 17px; 
            transition: color 0.3s; 
        } 
 
        .nav-links a:hover { 
            color: #00bcd4; 
        } 
 
        #menu-toggle { 
            display: none; 
        } 
 
 
        .menu-icon { 
            display: none; 
            font-size: 28px; 
            cursor: pointer; 
        } 
 
        @media screen and (max-width: 768px) { 
 
            nav { 
                padding: 15px 20px; 
            } 
 
            .menu-icon { 
                display: block; 
            } 
 
            .nav-links { 
                display: none; 
                flex-direction: column; 
                position: absolute; 
                top: 60px; 
                left: 0; 
                width: 100%; 
                background-color: #222; 
                text-align: center; 
                gap: 0; 
            } 
 
            .nav-links li { 
                padding: 15px; 
            } 
 
            #menu-toggle:checked ~ .nav-links { 
                display: flex; 
            } 
        } 
 
    </style> 
</head> 
 
<body> 
 
    <nav> 
 
        <div class="logo"> 
            MyWebsite 
        </div> 
 
        <input type="checkbox" id="menu-toggle"> 
 
 
        <label for="menu-toggle" class="menu-icon"> 
            &#9776; 
        </label> 
 
        <ul class="nav-links"> 
 
            <li><a href="#home">Home</a></li> 
 
            <li><a href="#about">About</a></li> 
 
            <li><a href="#services">Services</a></li> 
 
            <li><a href="#portfolio">Portfolio</a></li> 
 
            <li><a href="#contact">Contact</a></li> 
 
        </ul> 
 
    </nav> 
 
    <main> 
        <h1>Welcome to My Website</h1> 
        <p>Showcasing a responsive navigation bar using HTML and CSS.</p> 
    </main> 
 
</body> 
</html>
